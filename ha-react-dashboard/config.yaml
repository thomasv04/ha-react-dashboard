name: 'HA React Dashboard'
version: '3.1.6'
slug: 'ha-react-dashboard'
description: 'Responsive React-based dashboard for Home Assistant with drag-and-drop widgets'
url: 'https://github.com/thomasv04/ha-react-dashboard'

# Pre-built Docker images pulled by the supervisor ({arch} → amd64 / aarch64)
image: 'ghcr.io/thomasv04/ha-react-dashboard/{arch}'

arch:
  - amd64
  - aarch64

startup: application
boot: auto
init: false

homeassistant_api: true

ingress: true
ingress_port: 8099
panel_icon: 'mdi:view-dashboard'

# Sonde de santé : sans elle le superviseur ne redémarre jamais l'add-on figé —
# le conteneur tourne toujours, seul le serveur ne répond plus. `/api/health`
# est monté avant l'authentification et avant le limiteur de débit, sans quoi
# un pic de trafic ou l'absence de jeton provoquerait des redémarrages en
# boucle sur un add-on parfaitement sain.
watchdog: 'http://[HOST]:[PORT:8099]/api/health'
# Le serveur Express ne peut pas distinguer un administrateur d'un utilisateur
# ordinaire : derrière l'ingress, le superviseur authentifie mais ne transmet
# pas le rôle. C'est donc lui qui doit restreindre l'accès au panneau. Valeur
# par défaut du superviseur, rendue explicite : elle porte ici une décision de
# sécurité, pas une préférence d'affichage.
panel_admin: true

# Optional long-lived token; if empty run.sh falls back to $SUPERVISOR_TOKEN
# music_assistant_token : jeton créé dans Music Assistant (Paramètres > profil >
# jetons d'accès), pour la file d'attente complète. Il reste dans l'add-on.
# music_assistant_url : vide = MA sur l'hôte (http://172.30.32.1:8095).
options:
  ha_token: ''
  music_assistant_token: ''
  music_assistant_url: ''
schema:
  ha_token: str?
  music_assistant_token: password?
  music_assistant_url: url?
