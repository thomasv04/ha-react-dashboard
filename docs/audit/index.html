<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit qualité — ha-dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-0: #0b0f1a; --bg-1: #111827; --bg-2: #1e293b; --bg-3: #293548;
      --border: #334155; --text-0: #f1f5f9; --text-1: #cbd5e1; --text-2: #94a3b8;
      --accent: #3b82f6; --accent-glow: rgba(59,130,246,0.25);
      --green: #22c55e; --green-bg: rgba(34,197,94,0.12);
      --yellow: #eab308; --yellow-bg: rgba(234,179,8,0.12);
      --red: #ef4444; --red-bg: rgba(239,68,68,0.12);
      --blue: #3b82f6; --blue-bg: rgba(59,130,246,0.10);
      --radius: 12px;
      --font: 'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      --font-mono: 'JetBrains Mono','Fira Code','Cascadia Code',monospace;
    }
    html { scroll-behavior: smooth; }
    body { font-family: var(--font); background: var(--bg-0); color: var(--text-0); line-height: 1.6; min-height: 100vh; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: var(--font-mono); background: var(--bg-3); padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
    pre { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; overflow-x: auto; font-family: var(--font-mono); font-size: 0.82em; line-height: 1.5; margin: 12px 0; white-space: pre-wrap; word-break: break-word; }
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

    /* Header */
    .header { background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%); border-bottom: 1px solid var(--border); padding: 48px 0 36px; position: relative; overflow: hidden; }
    .header::before { content: ''; position: absolute; top: -100px; right: -100px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%); pointer-events: none; }
    .header h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; }
    .header h1 span { color: var(--accent); }
    .header .subtitle { color: var(--text-2); font-size: 1.05rem; }
    .header .date { color: var(--text-2); font-size: 0.85rem; margin-top: 4px; }

    /* Score Ring */
    .score-section { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; margin: -60px 0 40px; position: relative; z-index: 2; }
    .score-ring-container { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; display: flex; flex-direction: column; align-items: center; min-width: 200px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .score-ring { width: 140px; height: 140px; position: relative; }
    .score-ring svg { transform: rotate(-90deg); }
    .score-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
    .score-ring .bg { stroke: var(--bg-3); }
    .score-ring .fg { stroke: var(--accent); transition: stroke-dashoffset 1s ease; }
    .score-ring .value { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 800; color: var(--text-0); }
    .score-ring .value small { font-size: 1rem; color: var(--text-2); font-weight: 400; }
    .score-label { margin-top: 12px; font-size: 0.9rem; color: var(--text-2); font-weight: 500; }

    /* Score Breakdown */
    .score-breakdown { flex: 1; min-width: 300px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    .score-breakdown h3 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-2); margin-bottom: 16px; }
    .score-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .score-bar-label { width: 120px; font-size: 0.85rem; color: var(--text-1); flex-shrink: 0; }
    .score-bar-track { flex: 1; height: 8px; background: var(--bg-3); border-radius: 4px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 4px; transition: width 1s ease; }
    .score-bar-value { width: 36px; text-align: right; font-size: 0.85rem; font-weight: 600; color: var(--text-1); }

    /* Progress */
    .progress-section { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; margin-bottom: 32px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
    .progress-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .progress-header h3 { font-size: 1rem; font-weight: 600; }
    .progress-header .count { font-size: 0.9rem; color: var(--text-2); }
    .progress-track { height: 10px; background: var(--bg-3); border-radius: 5px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), #34d399); border-radius: 5px; transition: width 0.5s ease; }

    /* Navigation */
    .nav { position: sticky; top: 0; z-index: 50; background: rgba(11,15,26,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0; margin-bottom: 32px; }
    .nav-inner { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 8px 0; }
    .nav-inner::-webkit-scrollbar { display: none; }
    .nav-btn { background: none; border: none; color: var(--text-2); font-family: var(--font); font-size: 0.82rem; font-weight: 500; padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .nav-btn:hover { color: var(--text-0); background: var(--bg-2); }
    .nav-btn.active { color: var(--accent); background: var(--accent-glow); }

    /* Section */
    .section { margin-bottom: 40px; scroll-margin-top: 60px; }
    .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; cursor: pointer; user-select: none; }
    .section-header:hover .section-title { color: var(--accent); }
    .section-icon { font-size: 1.4rem; }
    .section-title { font-size: 1.3rem; font-weight: 700; transition: color 0.15s; }
    .section-toggle { margin-left: auto; color: var(--text-2); transition: transform 0.2s; font-size: 1.2rem; }
    .section-toggle.collapsed { transform: rotate(-90deg); }

    /* Findings */
    .findings { display: flex; flex-direction: column; gap: 10px; }
    .finding { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 20px; display: flex; gap: 14px; align-items: flex-start; transition: border-color 0.15s; }
    .finding:hover { border-color: var(--bg-3); }
    .finding-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; flex-shrink: 0; }
    .finding-dot.good { background: var(--green); box-shadow: 0 0 8px var(--green); }
    .finding-dot.warning { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
    .finding-dot.critical { background: var(--red); box-shadow: 0 0 8px var(--red); }
    .finding-dot.info { background: var(--blue); box-shadow: 0 0 8px var(--blue); }
    .finding-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .finding-detail { color: var(--text-2); font-size: 0.88rem; line-height: 1.55; }

    /* Priority cards */
    .priorities-section { margin-bottom: 40px; scroll-margin-top: 60px; }
    .priority-card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: border-color 0.15s, opacity 0.3s; }
    .priority-card.done { opacity: 0.55; }
    .priority-card.done .priority-title { text-decoration: line-through; text-decoration-color: var(--text-2); }
    .priority-header { display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; user-select: none; }
    .priority-header:hover { background: var(--bg-2); }
    .priority-badge { font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.04em; flex-shrink: 0; }
    .priority-badge.P0 { background: var(--red-bg); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
    .priority-badge.P1 { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(234,179,8,0.3); }
    .priority-badge.P2 { background: var(--blue-bg); color: var(--blue); border: 1px solid rgba(59,130,246,0.3); }
    .priority-badge.P3 { background: rgba(34,197,94,0.1); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .priority-checkbox { appearance: none; width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 6px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; background: transparent; }
    .priority-checkbox:checked { background: var(--green); border-color: var(--green); }
    .priority-checkbox:checked::after { content: '\2713'; color: white; font-size: 12px; font-weight: 700; }
    .priority-title { flex: 1; font-weight: 600; font-size: 0.92rem; }
    .priority-tags { display: flex; gap: 6px; flex-shrink: 0; }
    .priority-tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; background: var(--bg-3); color: var(--text-2); }
    .priority-chevron { color: var(--text-2); transition: transform 0.2s; font-size: 1.1rem; flex-shrink: 0; }
    .priority-chevron.open { transform: rotate(90deg); }
    .priority-body { display: none; padding: 0 20px 20px 54px; border-top: 1px solid var(--border); }
    .priority-body.open { display: block; padding-top: 16px; }
    .priority-body h4 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); margin-bottom: 8px; margin-top: 16px; }
    .priority-body h4:first-child { margin-top: 0; }
    .priority-files { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .priority-file { font-family: var(--font-mono); font-size: 0.78rem; padding: 3px 10px; background: var(--bg-2); border: 1px solid var(--border); border-radius: 6px; color: var(--accent); }
    .prompt-block { background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-size: 0.82rem; line-height: 1.6; color: var(--text-1); white-space: pre-wrap; word-break: break-word; position: relative; margin-top: 8px; }
    .copy-btn { position: absolute; top: 8px; right: 8px; background: var(--bg-3); border: 1px solid var(--border); color: var(--text-2); font-family: var(--font); font-size: 0.75rem; padding: 4px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; }
    .copy-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }
    .copy-btn.copied { background: var(--green); color: white; border-color: var(--green); }

    /* Filter pills */
    .filter-bar { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-pill { background: var(--bg-2); border: 1px solid var(--border); color: var(--text-2); font-family: var(--font); font-size: 0.8rem; padding: 6px 14px; border-radius: 20px; cursor: pointer; transition: all 0.15s; }
    .filter-pill:hover { border-color: var(--accent); color: var(--text-0); }
    .filter-pill.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

    /* Footer */
    .footer { border-top: 1px solid var(--border); padding: 32px 0; text-align: center; color: var(--text-2); font-size: 0.85rem; margin-top: 60px; }

    @media (max-width: 768px) {
      .score-section { flex-direction: column; gap: 20px; }
      .score-ring-container { width: 100%; }
      .score-breakdown { min-width: unset; }
      .header h1 { font-size: 1.6rem; }
      .priority-tags { display: none; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="container">
    <h1>Audit qualit&#233; &#8212; <span>ha-dashboard</span></h1>
    <p class="subtitle">React &#183; TypeScript &#183; Home Assistant &#183; Vite &#183; Tailwind CSS v4</p>
    <p class="date" id="audit-date"></p>
  </div>
</header>

<div class="container">
  <div class="score-section">
    <div class="score-ring-container">
      <div class="score-ring">
        <svg viewBox="0 0 160 160" width="140" height="140">
          <circle class="bg" cx="80" cy="80" r="70"/>
          <circle class="fg" id="score-arc" cx="80" cy="80" r="70" stroke-dasharray="440" stroke-dashoffset="440"/>
        </svg>
        <div class="value" id="score-value"></div>
      </div>
      <div class="score-label">Score global</div>
    </div>
    <div class="score-breakdown" id="score-breakdown">
      <h3>D&#233;tail par axe</h3>
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <h3>&#128203; Avancement des corrections</h3>
      <span class="count" id="progress-count"></span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>
</div>

<nav class="nav">
  <div class="container">
    <div class="nav-inner" id="nav-inner"></div>
  </div>
</nav>

<main class="container">
  <div id="sections-container"></div>

  <section class="priorities-section" id="priorities-section">
    <div class="section-header" style="margin-bottom: 20px;">
      <span class="section-icon">&#127919;</span>
      <h2 class="section-title">10. Recommandations prioris&#233;es</h2>
    </div>
    <div class="filter-bar" id="filter-bar">
      <button class="filter-pill active" data-filter="all">Toutes</button>
      <button class="filter-pill" data-filter="P0">&#128308; P0</button>
      <button class="filter-pill" data-filter="P1">&#128992; P1</button>
      <button class="filter-pill" data-filter="P2">&#128993; P2</button>
      <button class="filter-pill" data-filter="P3">&#128994; P3</button>
      <button class="filter-pill" data-filter="done">&#9989; Fait</button>
      <button class="filter-pill" data-filter="todo">&#11036; &#192; faire</button>
    </div>
    <div id="priorities-container"></div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    G&#233;n&#233;r&#233; par Claude Opus 4.6 &#8212; Donn&#233;es persist&#233;es en localStorage
  </div>
</footer>

<script>
// Load data from JSON file (same directory)
fetch('./audit-data.json')
  .then(r => r.json())
  .then(data => { window.AUDIT_DATA = data; init(); })
  .catch(() => {
    document.body.innerHTML = '<div style="padding:40px;color:#ef4444;font-size:1.2rem;">Erreur : impossible de charger audit-data.json.<br>Lancez un serveur local (npx serve docs/audit) ou ouvrez via http://</div>';
  });

const STORAGE_KEY = 'ha-dashboard-audit-progress';
function loadProgress() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch { return {}; } }
function saveProgress(p) { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }
let progress = loadProgress();

function init() {
  const D = window.AUDIT_DATA;
  // Seed progress from JSON done flags (JSON is source of truth)
  D.priorities.forEach(p => { if (p.done) progress[p.id] = true; });
  saveProgress(progress);
  renderScore(D);
  renderBreakdown(D);
  renderSections(D);
  renderPriorities(D);
  updateProgress(D);
  setTimeout(() => renderNav(D), 0);
}

function renderScore(D) {
  const s = D.meta.score, circ = 2 * Math.PI * 70;
  document.getElementById('score-value').innerHTML = s + '<small>/10</small>';
  document.getElementById('audit-date').textContent = 'Audit du ' + D.meta.date;
  requestAnimationFrame(() => {
    const arc = document.getElementById('score-arc');
    arc.style.strokeDashoffset = circ - (s / 10) * circ;
    arc.style.stroke = 'hsl(' + ((s / 10) * 120) + ', 70%, 55%)';
  });
}

function renderBreakdown(D) {
  const c = document.getElementById('score-breakdown');
  Object.values(D.meta.scoreBreakdown).forEach(e => {
    const pct = (e.score / 10) * 100, hue = (e.score / 10) * 120, col = 'hsl(' + hue + ',70%,55%)';
    const r = document.createElement('div'); r.className = 'score-bar-row';
    r.innerHTML = '<span class="score-bar-label">' + e.label + '</span><div class="score-bar-track"><div class="score-bar-fill" style="width:' + pct + '%;background:' + col + '"></div></div><span class="score-bar-value">' + e.score + '</span>';
    c.appendChild(r);
  });
}

function renderNav(D) {
  const nav = document.getElementById('nav-inner');
  D.sections.forEach(s => {
    const b = document.createElement('button'); b.className = 'nav-btn';
    b.textContent = s.icon + ' ' + s.title.replace(/^\d+\.\s*/, '');
    b.addEventListener('click', () => document.getElementById('section-' + s.id).scrollIntoView({ behavior: 'smooth' }));
    nav.appendChild(b);
  });
  const b = document.createElement('button'); b.className = 'nav-btn';
  b.textContent = '\uD83C\uDFAF Recommandations';
  b.addEventListener('click', () => document.getElementById('priorities-section').scrollIntoView({ behavior: 'smooth' }));
  nav.appendChild(b);
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        nav.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
        const idx = [...document.querySelectorAll('.section, .priorities-section')].indexOf(e.target);
        if (idx >= 0 && nav.children[idx]) nav.children[idx].classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -70% 0px' });
  document.querySelectorAll('.section, .priorities-section').forEach(s => obs.observe(s));
}

function renderSections(D) {
  const c = document.getElementById('sections-container');
  D.sections.forEach(s => {
    const el = document.createElement('section'); el.className = 'section'; el.id = 'section-' + s.id;
    el.innerHTML = '<div class="section-header" onclick="toggleSection(\'' + s.id + '\')"><span class="section-icon">' + s.icon + '</span><h2 class="section-title">' + s.title + '</h2><span class="section-toggle" id="toggle-' + s.id + '">\u25BC</span></div><div class="findings" id="findings-' + s.id + '">' + s.findings.map(f => '<div class="finding"><div class="finding-dot ' + f.status + '"></div><div><div class="finding-title">' + esc(f.title) + '</div><div class="finding-detail">' + esc(f.detail) + '</div></div></div>').join('') + '</div>';
    c.appendChild(el);
  });
}

function toggleSection(id) {
  const f = document.getElementById('findings-' + id), t = document.getElementById('toggle-' + id);
  if (f.style.display === 'none') { f.style.display = 'flex'; t.classList.remove('collapsed'); }
  else { f.style.display = 'none'; t.classList.add('collapsed'); }
}

let currentFilter = 'all';
function renderPriorities(D) {
  const c = document.getElementById('priorities-container'); c.innerHTML = '';
  D.priorities.filter(p => {
    if (currentFilter === 'all') return true;
    if (currentFilter === 'done') return progress[p.id] === true;
    if (currentFilter === 'todo') return progress[p.id] !== true;
    return p.priority === currentFilter;
  }).forEach(p => {
    const isDone = progress[p.id] === true;
    const card = document.createElement('div'); card.className = 'priority-card' + (isDone ? ' done' : ''); card.id = 'priority-' + p.id;
    card.innerHTML = '<div class="priority-header"><input type="checkbox" class="priority-checkbox" data-id="' + p.id + '"' + (isDone ? ' checked' : '') + ' /><span class="priority-badge ' + p.priority + '">' + p.priority + '</span><span class="priority-title">' + esc(p.title) + '</span><div class="priority-tags"><span class="priority-tag">' + esc(p.category) + '</span><span class="priority-tag">Impact: ' + esc(p.impact) + '</span><span class="priority-tag">Effort: ' + esc(p.effort) + '</span></div><span class="priority-chevron">\u203A</span></div><div class="priority-body" id="body-' + p.id + '"><h4>Fichiers concern\u00E9s</h4><div class="priority-files">' + p.files.map(f => '<span class="priority-file">' + esc(f) + '</span>').join('') + '</div><h4>Prompt \u00E0 donner</h4><div class="prompt-block"><button class="copy-btn" onclick="copyPrompt(this,\'' + p.id + '\')">Copier</button><div class="prompt-text">' + esc(p.prompt) + '</div></div></div>';
    card.querySelector('.priority-header').addEventListener('click', e => {
      if (e.target.classList.contains('priority-checkbox')) return;
      document.getElementById('body-' + p.id).classList.toggle('open');
      card.querySelector('.priority-chevron').classList.toggle('open');
    });
    card.querySelector('.priority-checkbox').addEventListener('change', e => {
      e.stopPropagation();
      progress[p.id] = e.target.checked;
      saveProgress(progress);
      card.classList.toggle('done', e.target.checked);
      updateProgress(D);
    });
    c.appendChild(card);
  });
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function copyPrompt(btn, id) {
  const item = window.AUDIT_DATA.priorities.find(p => p.id === id);
  if (!item) return;
  navigator.clipboard.writeText(item.prompt).then(() => {
    btn.textContent = 'Copi\u00E9 !'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copier'; btn.classList.remove('copied'); }, 2000);
  });
}

document.getElementById('filter-bar').addEventListener('click', e => {
  if (!e.target.classList.contains('filter-pill')) return;
  document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  renderPriorities(window.AUDIT_DATA);
});

function updateProgress(D) {
  const total = D.priorities.length, done = D.priorities.filter(p => progress[p.id] === true).length;
  document.getElementById('progress-count').textContent = done + ' / ' + total;
  document.getElementById('progress-fill').style.width = (total > 0 ? (done / total) * 100 : 0) + '%';
}
</script>
</body>
</html>
