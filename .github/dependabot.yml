# Mises à jour de dépendances.
#
# Groupées et hebdomadaires : une PR par écosystème et par semaine. Dégroupées,
# elles arrivaient à la douzaine et finissaient par être fusionnées sans être
# lues — ce qui est pire que pas de Dependabot du tout.
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Les correctifs de sécurité méritent leur propre PR, tout de suite.
      production:
        dependency-type: production
        update-types: ['minor', 'patch']
      development:
        dependency-type: development
        update-types: ['minor', 'patch']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
