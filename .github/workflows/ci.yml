name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Qualité du code ─────────────────────────────────────────────────
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "*.{ts,js,json,md}"

      - name: ESLint
        run: npm run lint

      - name: Widget registry sync check
        run: npm run check:widgets

  # ── Job 2: TypeScript ──────────────────────────────────────────────────────
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run type-check

  # ── Vulnérabilités des dépendances ────────────────────────────────────────
  # L'add-on tourne sur le réseau domestique avec un jeton Home Assistant à
  # portée : une faille dans une dépendance transitive vaut un accès à la
  # maison. Seuil `high` — en dessous, le bruit ferait ignorer le job.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm audit
        run: npm audit --audit-level=high

  # ── Conformité de l'empaquetage ───────────────────────────────────────────
  # `hassfest` valide le manifeste au regard des règles de HA, `hacs/action`
  # valide `hacs.json` et la structure du dépôt. Les deux échouent au moindre
  # champ manquant — c'est ce qui casse une installation HACS, pas le code.
  validate:
    name: Hassfest & HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration
          # `brands` : réservé aux intégrations du dépôt HACS par défaut ; ce
          # dépôt s'ajoute en dépôt personnalisé.
          ignore: brands

  # ── Intégration Home Assistant (Python) ───────────────────────────────────
  integration:
    name: HA Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.14 : c'est ce qu'exige le harnais qui embarque HA 2026.8.1, la version
      # visée en production. (Non installable sous Windows — HA importe `fcntl`.)
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          # Sans ce chemin, le cache cherche `requirements.txt` / `pyproject.toml`
          # à la racine, n'en trouve aucun et fait échouer l'étape. Les
          # dépendances Python de ce dépôt tiennent dans ce seul fichier.
          cache-dependency-path: requirements-test.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Une des vues sert le bundle : sans lui, le test correspondant échoue.
      - name: Build the Lovelace card bundle
        run: |
          npm ci
          npm run build:panel

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Run integration tests
        run: pytest

  # ── Job 3: Unit tests ─────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:run

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ── Job 4: E2E tests ──────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium

      # Pas de `--with-deps` : les runners `ubuntu-latest` embarquent déjà les
      # bibliothèques système de Chromium. L'étape apt qu'il déclenche passait
      # un quart d'heure à expirer sur le miroir `azure.archive.ubuntu.com`
      # avant de basculer sur `archive.ubuntu.com` — et elle tournait sur les
      # *deux* branches du cache, qui n'économisait donc que le téléchargement
      # du navigateur. Si une lib venait à manquer, Chromium échouerait au
      # lancement, franchement : remettre `--with-deps` ici seulement.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Start Storybook
        run: npm run storybook &

      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 60000

      - name: Run e2e tests
        run: npm run test:e2e

  # ── Job 5: Dashboard E2E tests ─────────────────────────────────────────────
  e2e-dashboard:
    name: Dashboard E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium

      # Pas de `--with-deps` : les runners `ubuntu-latest` embarquent déjà les
      # bibliothèques système de Chromium. L'étape apt qu'il déclenche passait
      # un quart d'heure à expirer sur le miroir `azure.archive.ubuntu.com`
      # avant de basculer sur `archive.ubuntu.com` — et elle tournait sur les
      # *deux* branches du cache, qui n'économisait donc que le téléchargement
      # du navigateur. Si une lib venait à manquer, Chromium échouerait au
      # lancement, franchement : remettre `--with-deps` ici seulement.
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run dashboard e2e tests
        run: npm run test:e2e:dashboard

      - name: Upload report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-dashboard-report
          path: playwright-report-dashboard/
          retention-days: 7

  # ── Job 6: Build ──────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, e2e-tests, e2e-dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build
        env:
          VITE_FOLDER_NAME: ha-dashboard
          # HA credentials are not needed for a build check; use placeholders
          VITE_HA_URL: http://localhost:8123
          VITE_HA_TOKEN: placeholder-token-for-ci

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3
