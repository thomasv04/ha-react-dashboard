name: Build & Publish Add-on

on:
  push:
    tags:
      - 'v*'
  # Repli manuel : un tag poussé par le GITHUB_TOKEN par défaut ne déclenche
  # aucun workflow. Choisir le tag comme ref au lancement (« Use workflow from »
  # → le tag `vX.Y.Z`) relance donc la publication à l'identique — `GITHUB_REF_NAME`
  # vaut alors le nom du tag, comme sur un push.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Job 1: Quality checks ──────────────────────────────────────────────────
  quality:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  # ── Job 2: Tests ──────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

  # ── Job 3: Type-check ──────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type-check
        run: npm run type-check

  # ── Job 4: E2E tests ──────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Aligné sur `ci.yml` : cache du navigateur, chromium seul (les deux
      # configs Playwright ne déclarent que ce projet), et pas de `--with-deps`
      # — l'étape apt qu'il déclenche expirait sur le miroir Azure pendant un
      # quart d'heure, pour des libs déjà présentes sur `ubuntu-latest`.
      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ steps.pw-version.outputs.version }}-chromium

      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Start Storybook
        run: npm run storybook &

      - name: Wait for Storybook to be ready
        run: npx wait-on http://localhost:6006 --timeout 60000

      - name: Run e2e tests
        run: npm run test:e2e

  # ── Job 5: Build & Publish ────────────────────────────────────────────────
  build:
    name: Build & Publish
    permissions:
      contents: write
      packages: write

    runs-on: ubuntu-latest
    needs: [quality, test, typecheck, e2e-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Extract version (strip leading "v")
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          # Format expected by HA supervisor: image/{arch}:{version}  (no "v" prefix)
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/amd64:${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push Docker image (aarch64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/aarch64:${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}

      # ── Intégration HACS ────────────────────────────────────────────────
      # Le bundle du panneau n'est pas versionné : il est construit ici puis
      # zippé avec l'intégration. `hacs.json` (zip_release) fait pointer HACS
      # sur cette archive.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build Lovelace card bundle
        run: |
          npm ci
          npm run build:panel

      - name: Sync integration version with the tag
        run: |
          node -e "
            const fs = require('fs');
            const p = 'custom_components/ha_react_dashboard/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.version = '${{ steps.version.outputs.value }}';
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "

      - name: Zip integration for HACS
        run: |
          cd custom_components/ha_react_dashboard
          zip -r ../../ha_react_dashboard.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ha_react_dashboard.zip
          body: |
            ## Installation

            ### 🧩 **Tableau de bord Lovelace (recommandé — « définir par défaut » possible)**
            ```
            HACS → Intégrations → ⋮ → Dépôt personnalisé
            URL: https://github.com/${{ github.repository }}   (catégorie: Integration)
            ```
            Puis **Paramètres → Appareils et services → Ajouter une intégration → HA React Dashboard**.
            Enfin, sur chaque téléphone/tablette : **Paramètres → Tableaux de bord → React Dashboard → « Définir par défaut sur cet appareil »**.

            ### 🐳 **Home Assistant Add-on**
            ```
            Settings → Add-ons → Add-on Store (⋮) → Repositories
            URL: https://github.com/${{ github.repository }}
            ```
            Then install **HA React Dashboard** from the add-ons store.

            ---

            ## ✨ Features
            - ✅ Runtime config injection (no token baked into the image)
            - ✅ Auto session management
            - ✅ Drag-and-drop widget layout
            - ✅ Responsive CSS Grid design
            - ✅ Real-time entity updates

            ## 📋 Requirements
            - Home Assistant 2026.1.0 or later
            - Admin access

            ## 🏗️ Architecture Support
            - AMD64 (x86_64 / Intel / AMD)
            - ARM64 (64-bit Raspberry Pi 4/5, ODROID, etc.)

            ## 🐳 Docker images
            ```
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-amd64
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-aarch64
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
