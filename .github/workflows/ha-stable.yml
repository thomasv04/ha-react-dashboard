name: HA stable

# Les tests dans Home Assistant, sur la dernière version publiée plutôt que sur
# celle figée dans `scripts/ha-e2e.mjs` : une mise à jour de HA qui casse la
# carte se voit ici avant d'arriver chez l'utilisateur.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

jobs:
  e2e-ha-stable:
    name: E2E in Home Assistant (stable)
    runs-on: ubuntu-latest
    env:
      HA_VERSION: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Run e2e tests in Home Assistant
        run: npm run test:ha

      - name: Upload report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ha-stable-report
          path: playwright-report-ha/
          retention-days: 7
