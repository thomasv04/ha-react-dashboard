name: PR screenshots cleanup

# Une PR fermée n'a plus besoin de ses captures sur `ci-screenshots`
# (`scripts/pr-screenshots.sh`).
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Remove the PR screenshots
        run: bash scripts/pr-screenshots.sh ${{ github.event.pull_request.number }} --remove
