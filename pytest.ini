[pytest]
testpaths = tests/python
asyncio_mode = auto
# Sans ça, `pytest` nu ne trouve pas `custom_components` : seul `python -m pytest`
# ajoute le dossier courant à `sys.path`. La CI appelle `pytest`.
pythonpath = .
# `no:socket` : sous Windows, la boucle d'événements asyncio ouvre elle-même une
# paire de sockets locale. pytest-socket la bloque avant même que le test démarre.
addopts = -q -p no:cacheprovider -p no:socket
